<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>배탈의 민족</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="/css/thymeleaf/style.css">
</head>
<body>
	<div id="wrap" class="container">
		<header class="color d-flex align-items-center">
			<div class="m-4">
				<h2 class="text-white">배탈의 민족</h2>
			</div>
		</header>
		<main class="mt-2">
			<div class="display-5">우리동네 가게</div>
			<div th:each="store:${storeList}" class="border border-info rounded my-3 p-3">
				<a href="#" class="nav-link text-dark">
					<h5 th:text="${store.name}"></h5>
					<div th:text="${'전화 번호 : ' + store.phoneNumber}"></div>
					<div th:text="${'주소 : ' + store.address}"></div>
				</a>
			</div>
		</main>
		
		<footer>
			<hr>
			<div>(주)우와한형제</div>
			<div class="text-secondary small">고객센터 : 1500-1500</div>
		</footer>
	</div>
	
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
<script>

	$(function() {
		
		
		
	})
</script>
</body>
</html>
