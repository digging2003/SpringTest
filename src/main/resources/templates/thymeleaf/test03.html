<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
<div class="container">

	<h1>회원 정보 리스트</h1>
	
	<table class="table text-center">
		<thead>
			<tr>
				<th>No</th>
				<th>이름</th>
				<th>생년월일</th>
				<th>전화번호</th>
				<th>국적</th>
				<th>이메일</th>
				<th>자기소개</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="member, status:${members}">
			
				<td th:text="${status.count}"></td>
				
				<td th:text="${member.name}"></td>
				
				<td th:text="${#temporals.format(member.birth, 'yyyy년 m월 d일')}"></td>
				
				<div>
					<td th:if="${#strings.startsWith(member.phoneNumber, '010')}" th:text="${member.phoneNumber}"></td>
					<td th:unless="${#strings.startsWith(member.phoneNumber, '010')}" th:text="'유효하지 않은 전화번호'"></td>
				</div>
				
				<td th:text="${#strings.replace(member.nationality, '삼국시대', '삼국 -')}"></td>

				<td>
					<span th:text="${#strings.substringBefore(member.email, '@')}" class="fw-bold"></span>
					<span th:text="'@' + ${#strings.substringAfter(member.email, '@')}"></span>
				</td>
				
				<td>
					<div th:if="${#strings.length(member.introduce) <= 15}" th:text="${member.introduce}"></div>
					<div th:unless="${#strings.length(member.introduce) <= 15}" th:text="${#strings.substring(member.introduce, 0, 15)} + '...'"></div>
				</td>
			</tr>
		</tbody>
	
	</table>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>

</body>
</html>
