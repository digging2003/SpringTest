<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>예약 하기</title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
        <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
        <link rel="stylesheet" href="/css/ajax/style.css">
    </head>

    <body>
        <div id="wrap" class="justify-content-center">
            <header class="text-center pt-4">
                <div class="display-3">통나무 펜션</div>
            </header>
            <section class="color3 ">
                <nav>
                    <ul class="nav d-flex justify-content-around align-items-center">
                        <li class="nav-item"><a class="nav-link text-light" href="#">펜션소개</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="#">객실보기</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="#">예약안내</a></li>
                        <li class="nav-item"><a class="nav-link text-light" href="#">커뮤니티</a></li>
                    </ul>
                    
                </nav>
            </section>

			<main>
				<div class="text-center my-4">
            		<h2>예약 하기</h2>
            	</div>
            	
            	<div class="d-flex justify-content-center align-items-center">
	            	<div class="col-6">
	            		<span>이름</span> <input type="text" class="form-control mb-3" id="nameInput">
	            		<span>예약날짜</span> <input type="text" class="form-control mb-3" id="dateInput">
	            		<span>숙박일수</span> <input type="text" class="form-control mb-3" id="dayInput">
	            		<span>숙박인원</span> <input type="text" class="form-control mb-3" id="headcountInput">
	            		<span>전화번호</span> <input type="text" class="form-control mb-3" id="phoneNumberInput">
	            		<button type="button" class="btn btn-warning col-12" id="reservationBtn">예약하기</button>
	            	</div>
            	</div>
            	
			</main>

            <footer>
                <pre class="text-secondary m-3">
제주특별자치도제주시애월읍
사업자등록번호:111-22-255222/농어촌민박사업자지정/대표:김통목
Copyright 2025 tongnamu All right reserved
                </pre>
            </footer>
        </div>


        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script> 
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
        <script>


            $(function() {
            	
                $("#dateInput").datepicker({
                    dateFormat:"yy년 mm월 dd일",
                    minDate:0
                });


               $("#reservationBtn").on("click", function() {
            	   
            	   let name = $("#nameInput").val();
            	   let date = $("#dateInput").val();
            	   let day = $("#dayInput").val();
            	   let headcount = $("#headcountInput").val();
            	   let phoneNumber = $("#phoneNumberInput").val();
            	   
            	   if(name == "") {
            		   alert("이름을 입력하세요.");
            		   return;
            	   }
            	   if(date == "") {
            		   alert("예약날짜를 입력하세요.");
            		   return;
            	   }
            	   if(day == "") {
            		   alert("숙박일수를 입력하세요.");
            		   return;
            	   }
            	   if(headcount == "") {
            		   alert("숙박인원을 입력하세요.");
            		   return;
            	   }
            	   if(phoneNumber == "") {
            		   alert("전화번호를 입력하세요.");
            		   return;
            	   }
            	   
	               	$.ajax({
	    				type:"post"
	    				, url:"/ajax/booking/create"
	    				, data:{"name":name, "date":date, "day":day, "headcount":headcount, "phoneNumber":phoneNumber}
	    				, success:function(response) {
	    					alert("예약되었습니다.");
	    				}
	    				, error:function() {
	    					alert("예약 에러!");
	    				}
	            	
	            	});
            	   
               });

            });
        </script>
            
            
        

    </body>
</html>
